[package]
name = "fue"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
authors = ["Daniel Doubrovkine and contributors"]
description = "Find e-mail addresses of GitHub users and repository contributors."
license = "MIT"
repository = "https://github.com/dblock/fue-rs"
readme = "README.md"
keywords = ["github", "email", "cli"]
categories = ["command-line-utilities"]
include = ["src/**/*", "graphql/**/*", "tests/**/*", "README.md", "CHANGELOG.md", "LICENSE"]

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.9", features = ["derive"] }
futures = "0.3.34"
graphql_client = "0.16.0"
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
assert_cmd = "2.2.2"
criterion = { version = "0.8.2", features = ["async_tokio"] }
predicates = "3.1.4"
wiremock = "0.6.5"

[workspace.metadata.dylint]
libraries = [
    { git = "https://github.com/dblock/dylint-spellcheck", tag = "v0.1.0" },
]

[[example]]
name = "logo"
test = true

[[bench]]
name = "addresses"
harness = false

[[bench]]
name = "search"
harness = false

# Smaller, faster release binaries: optimize across crates and leave out debug symbols.
[profile.release]
codegen-units = 1
lto = true
strip = true
